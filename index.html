<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Virtual Piano</title>
    <link rel="stylesheet" href="src/piano.css" />
  </head>
  <body>
    <div class="piano-container">
      <!-- Octave labels -->
      <div class="octave-label" data-octave="3">C3</div>
      <div class="octave-label" data-octave="4">C4</div>

      <!-- Piano keys -->
      <div class="keyboard-keys">
        <button class="key white" data-note="C3" data-octave="3">C</button>
        <button class="key black" data-note="C3#" data-octave="3">D</button>
        <button class="key white" data-note="D3" data-octave="3">D</button>
        <button class="key black" data-note="D3#" data-octave="3">E</button>
        <button class="key white" data-note="E3" data-octave="3">E</button>
        <button class="key white" data-note="F3" data-octave="3">F</button>
        <button class="key black" data-note="F3#" data-octave="3">G</button>
        <button class="key white" data-note="G3" data-octave="3">G</button>
        <button class="key black" data-note="G3#" data-octave="3">A</button>
        <button class="key white" data-note="A3" data-octave="3">A</button>
        <button class="key black" data-note="A3#" data-octave="3">B</button>
        <button class="key white" data-note="B3" data-octave="3">B</button>
        <button class="key white" data-note="C4" data-octave="4">C</button>
        <button class="key black" data-note="C4#" data-octave="4">D</button>
        <button class="key white" data-note="D4" data-octave="4">D</button>
        <button class="key black" data-note="D4#" data-octave="4">E</button>
        <button class="key white" data-note="E4" data-octave="4">E</button>
        <button class="key white" data-note="F4" data-octave="4">F</button>
        <button class="key black" data-note="F4#" data-octave="4">G</button>
        <button class="key white" data-note="G4" data-octave="4">G</button>
        <button class="key black" data-note="G4#" data-octave="4">A</button>
        <button class="key white" data-note="A4" data-octave="4">A</button>
        <button class="key black" data-note="A4#" data-octave="4">B</button>
        <button class="key white" data-note="B4" data-octave="4">B</button>
      </div>
    </div>

    <div
      id="audio-status"
      style="
        margin-top: 1rem;
        font-size: 0.85rem;
        color: #666;
        transition: opacity 0.3s;
      "
    >
      Audio context ready: <span id="audio-status-text">pending...</span>
    </div>

    <script src="src/main.js"></script>
  </body>
</html>
